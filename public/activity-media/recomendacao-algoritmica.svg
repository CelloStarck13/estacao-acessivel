<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">Recomendação algorítmica</title><desc id="d">Dois perfis realizam interações diferentes e recebem recomendações diferentes.</desc><rect width="800" height="420" rx="28" fill="#f4f8ff"/><g font-family="Arial,sans-serif"><rect x="55" y="70" width="250" height="260" rx="20" fill="#fff" stroke="#1d6fe8" stroke-width="4"/><text x="180" y="110" text-anchor="middle" font-size="24" font-weight="700" fill="#0b2b55">ANA</text><text x="180" y="155" text-anchor="middle" font-size="18" fill="#233">assiste futebol</text><text x="180" y="190" text-anchor="middle" font-size="18" fill="#233">curte futebol</text><path d="M180 220v45" stroke="#1d6fe8" stroke-width="8"/><path d="M160 250l20 20 20-20" fill="none" stroke="#1d6fe8" stroke-width="8"/><text x="180" y="305" text-anchor="middle" font-size="18" font-weight="700" fill="#0b2b55">mais futebol</text><rect x="495" y="70" width="250" height="260" rx="20" fill="#fff" stroke="#11845b" stroke-width="4"/><text x="620" y="110" text-anchor="middle" font-size="24" font-weight="700" fill="#0b2b55">BRUNO</text><text x="620" y="155" text-anchor="middle" font-size="18" fill="#233">assiste música</text><text x="620" y="190" text-anchor="middle" font-size="18" fill="#233">curte música</text><path d="M620 220v45" stroke="#11845b" stroke-width="8"/><path d="M600 250l20 20 20-20" fill="none" stroke="#11845b" stroke-width="8"/><text x="620" y="305" text-anchor="middle" font-size="18" font-weight="700" fill="#0b2b55">mais música</text><text x="400" y="380" text-anchor="middle" font-size="20" fill="#233">interação → sinal registrado → recomendação</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">Ordenação de lista</title><desc id="d">A lista 7, 3, 5 muda para 3, 7, 5 depois da comparação e troca dos dois primeiros valores.</desc><rect width="800" height="420" rx="28" fill="#f4f8ff"/><g font-family="Arial,sans-serif"><text x="400" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#0b2b55">Comparar e trocar</text><text x="210" y="115" text-anchor="middle" font-size="20" fill="#456">antes</text><g transform="translate(80 145)"><rect width="85" height="85" rx="14" fill="#fff" stroke="#d33" stroke-width="4"/><rect x="95" width="85" height="85" rx="14" fill="#fff" stroke="#d33" stroke-width="4"/><rect x="190" width="85" height="85" rx="14" fill="#fff" stroke="#1d6fe8" stroke-width="4"/><text x="42" y="56" text-anchor="middle" font-size="34" font-weight="700">7</text><text x="137" y="56" text-anchor="middle" font-size="34" font-weight="700">3</text><text x="232" y="56" text-anchor="middle" font-size="34" font-weight="700">5</text></g><path d="M365 185h70" stroke="#1d6fe8" stroke-width="8"/><path d="M420 165l22 20-22 20" fill="none" stroke="#1d6fe8" stroke-width="8"/><text x="590" y="115" text-anchor="middle" font-size="20" fill="#456">depois da troca</text><g transform="translate(455 145)"><rect width="85" height="85" rx="14" fill="#fff" stroke="#11845b" stroke-width="4"/><rect x="95" width="85" height="85" rx="14" fill="#fff" stroke="#11845b" stroke-width="4"/><rect x="190" width="85" height="85" rx="14" fill="#fff" stroke="#1d6fe8" stroke-width="4"/><text x="42" y="56" text-anchor="middle" font-size="34" font-weight="700">3</text><text x="137" y="56" text-anchor="middle" font-size="34" font-weight="700">7</text><text x="232" y="56" text-anchor="middle" font-size="34" font-weight="700">5</text></g><text x="400" y="310" text-anchor="middle" font-size="22" fill="#233">7 &gt; 3, então os dois valores trocam de posição.</text><text x="400" y="355" text-anchor="middle" font-size="18" fill="#456">Depois, o algoritmo continua comparando até chegar à ordem desejada.</text></g></svg>
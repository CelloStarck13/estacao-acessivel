<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">Tipos de dados em uma coleção</title><desc id="d">Três cartões mostram texto, número e imagem associados a máquinas de uma coleção.</desc><rect width="800" height="420" rx="28" fill="#f4f8ff"/><g font-family="Arial,sans-serif"><text x="400" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#0b2b55">Coleção de máquinas</text><rect x="65" y="100" width="200" height="220" rx="18" fill="#fff" stroke="#1d6fe8" stroke-width="4"/><text x="165" y="145" text-anchor="middle" font-size="22" font-weight="700">TEXTO</text><text x="165" y="205" text-anchor="middle" font-size="22">"Robô Azul"</text><text x="165" y="275" text-anchor="middle" font-size="17" fill="#456">nome da máquina</text><rect x="300" y="100" width="200" height="220" rx="18" fill="#fff" stroke="#e39b12" stroke-width="4"/><text x="400" y="145" text-anchor="middle" font-size="22" font-weight="700">NÚMERO</text><text x="400" y="215" text-anchor="middle" font-size="56" font-weight="700">8</text><text x="400" y="275" text-anchor="middle" font-size="17" fill="#456">pontuação</text><rect x="535" y="100" width="200" height="220" rx="18" fill="#fff" stroke="#11845b" stroke-width="4"/><text x="635" y="145" text-anchor="middle" font-size="22" font-weight="700">IMAGEM</text><circle cx="635" cy="210" r="46" fill="#dceaff" stroke="#1d6fe8" stroke-width="4"/><rect x="610" y="195" width="50" height="32" rx="8" fill="#1d6fe8"/><circle cx="622" cy="207" r="4" fill="#fff"/><circle cx="648" cy="207" r="4" fill="#fff"/><text x="635" y="275" text-anchor="middle" font-size="17" fill="#456">foto ou desenho</text><text x="400" y="370" text-anchor="middle" font-size="20" fill="#233">Cada item pode reunir diferentes tipos de dados.</text></g></svg>